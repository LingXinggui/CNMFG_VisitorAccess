<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>访客临时入场登记</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background:
        radial-gradient(circle at top, rgba(19, 114, 182, 0.16), transparent 32%),
        linear-gradient(180deg, #eef5fb 0%, #f7f9fc 100%);
    color: #1f2937;
    padding: 24px 16px;
}
.panel {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid #dbe5f0;
    border-radius: 3px;
    box-shadow: 0 18px 40px rgba(28, 63, 99, 0.10);
    overflow: hidden;
}
.hero {
    position: relative;
    padding: 28px 28px 18px;
    background: linear-gradient(135deg, #0f6cbd 0%, #0c8f77 100%);
    color: #fff;
    text-align: center;
}
.hero-top {
    position: relative;
    min-height: 34px;
    margin-bottom: 4px;
}
.hero-logo {
    position: absolute;
    left: 0;
    top: 0;
    height: 22.5px;
    width: auto;
    display: block;
}
.hero h1 {
    margin: 11px 0 8px;
    font-size: 28px;
    line-height: 1.2;
    text-align: center;
}
.hero p {
    margin: 0;
    font-size: 14px;
    opacity: 0.92;
    text-align: center;
}
form {
    padding: 24px 28px 28px;
}
.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px 16px;
}
.field {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.field.full {
    grid-column: 1 / -1;
}
label {
    font-size: 14px;
    font-weight: 600;
    color: #334155;
}
.required::after {
    content: " *";
    color: #d92d20;
}
input,
select,
textarea {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 3px;
    background: #fff;
    padding: 12px 14px;
    font-size: 15px;
    color: #0f172a;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: #0f6cbd;
    box-shadow: 0 0 0 4px rgba(15, 108, 189, 0.12);
}
textarea {
    min-height: 112px;
    resize: vertical;
}
.hint {
    font-size: 12px;
    color: #64748b;
    margin-top: -2px;
}
.actions {
    margin-top: 24px;
}
button {
    width: 100%;
    border: none;
    border-radius: 3px;
    padding: 14px 18px;
    background: linear-gradient(135deg, #0f6cbd 0%, #0b8f75 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    box-shadow: 0 12px 24px rgba(15, 108, 189, 0.18);
}
button:hover { transform: translateY(-1px); }
button:disabled {
    cursor: not-allowed;
    opacity: 0.7;
    transform: none;
}
#msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 3px;
    font-size: 14px;
    display: none;
}
#msg.info {
    display: block;
    background: #eff6ff;
    color: #1d4ed8;
}
#msg.success {
    display: block;
    background: #ecfdf3;
    color: #027a48;
}
#msg.error {
    display: block;
    background: #fef3f2;
    color: #b42318;
}
@media (max-width: 640px) {
    .hero,
    form {
        padding-left: 18px;
        padding-right: 18px;
    }
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
<div class="panel">
    <div class="hero">
        <div class="hero-top">
            <img class="hero-logo" src="file:///C:/Users/xinggui.ling/OneDrive%20-%20Thermo%20Fisher%20Scientific/VSProject/MOM/wwwroot/Icon/ThermoFisher.png" alt="Thermo Fisher" />
        </div>
        <h1>访客临时入场登记</h1>
        <p>请填写访客入场信息，带 * 的字段为必填项。</p>
    </div>

    <form id="visitorForm" novalidate>
        <input type="hidden" id="YearMonth" name="YearMonth" />
        <input type="hidden" id="YearWeek" name="YearWeek" />
        <input type="hidden" id="Title" name="Title" />
        <input type="hidden" id="EventDate" name="EventDate" />
        <input type="hidden" id="QTY" name="QTY" value="1" />
        <input type="hidden" id="HostEmployee" name="HostEmployee" value="" />
        <input type="hidden" id="Action" name="Action" value="Check-In" />
        <input type="hidden" id="DedicatedEmail" name="DedicatedEmail" value="" />
        <input type="hidden" id="ReceptionistEmail" name="ReceptionistEmail" value="" />
        <input type="hidden" id="VAID" name="VAID" value="" />
        <input type="hidden" id="ReferenceID" name="ReferenceID" value="" />
        <input type="hidden" id="VisitPeriod" name="VisitPeriod" />
        <input type="hidden" id="Urgent" name="Urgent" value="Urgent" />
        <input type="hidden" id="Risk" name="Risk" value="" />
        <input type="hidden" id="PeriodType" name="PeriodType" value="临时访客(单次)" />
        <input type="hidden" id="GUID" name="GUID" />

        <div class="grid">
            <div class="field">
                <label class="required" for="Factory">工厂</label>
                <select id="Factory" name="Factory" required>
                    <option value="">请选择工厂</option>
                    <option value="上海秦桥路工厂CMC">上海秦桥路工厂CMC</option>
                    <option value="上海金闽路工厂CMC2">上海金闽路工厂CMC2</option>
                    <option value="北京工厂BJ">北京工厂BJ</option>
                    <option value="苏州泰山路158工厂SZ TS158">苏州泰山路158工厂SZ TS158</option>
                    <option value="苏州泰山路297工厂SZ TS297">苏州泰山路297工厂SZ TS297</option>
                    <option value="广州科学城工厂G11">广州科学城工厂G11</option>
                    <option value="广州知识城工厂G77">广州知识城工厂G77</option>
                    <option value="苏州Bio Park工厂C栋SZBPC">苏州Bio Park工厂C栋SZBPC</option>
                    <option value="苏州Bio Park工厂T栋SZBPT">苏州Bio Park工厂T栋SZBPT</option>
                    <option value="广州智谷工厂G99">广州智谷工厂G99</option>
                </select>
            </div>

            <div class="field">
                <label class="required" for="TargetArea">目标区域</label>
                <input type="text" id="TargetArea" name="TargetArea" placeholder="请输入目标区域" required />
            </div>

            <div class="field">
                <label class="required" for="VisitorName">访客姓名</label>
                <input type="text" id="VisitorName" name="VisitorName" placeholder="请输入访客姓名" required />
                <div class="hint">姓名中不能包含空格。</div>
            </div>

            <div class="field">
                <label class="required" for="VisitorType">访客类型</label>
                <select id="VisitorType" name="VisitorType" required>
                    <option value="">请选择访客类型</option>
                    <option value="送货人员Deliver">送货人员Deliver</option>
                    <option value="客户Customer">客户Customer</option>
                    <option value="政府人员Visitor of Government">政府人员Visitor of Government</option>
                    <option value="赛默飞世尔员工ThermoFisher Employees">赛默飞世尔员工ThermoFisher Employees</option>
                    <option value="应聘人员Candidates">应聘人员Candidates</option>
                    <option value="施工人员Constructor">施工人员Constructor</option>
                    <option value="驻厂人员Resident Staff">驻厂人员Resident Staff</option>
                    <option value="律师团队Legal Firm">律师团队Legal Firm</option>
                    <option value="认证机构Certified Body">认证机构Certified Body</option>
                    <option value="审核机构Auditing Body">审核机构Auditing Body</option>
                    <option value="供应商Supplier">供应商Supplier</option>
                    <option value="其它Others">其它Others</option>
                </select>
            </div>

            <div class="field">
                <label class="required" for="VisitorCompany">访客公司</label>
                <input type="text" id="VisitorCompany" name="VisitorCompany" placeholder="请输入访客公司" required />
                <div class="hint">至少 2 个字符，不能包含符号或空格。</div>
            </div>

            <div class="field">
                <label class="required" for="VaildDocument">访客证件</label>
                <input type="text" id="VaildDocument" name="VaildDocument" placeholder="请输入访客证件" required />
                <div class="hint">至少 8 个字符，不能包含符号或空格。</div>
            </div>

            <div class="field">
                <label class="required" for="HostEmployeeMail">陪同人邮箱</label>
                <input type="text" id="HostEmployeeMail" name="HostEmployeeMail" placeholder="例如：susie.zhou" required />
                <div class="hint">请填写 ThermoFisher 邮箱 @ 前内容，提交时会自动补全为 @thermofisher.com。</div>
            </div>

            <div class="field">
                <label class="required" for="ContactNumber">联系电话</label>
                <input type="text" id="ContactNumber" name="ContactNumber" inputmode="numeric" placeholder="请输入 11 位手机号" required />
                <div class="hint">必须为 11 位纯数字，且不能为 11 位相同数字。</div>
            </div>

            <div class="field full">
                <label class="required" for="PurposeofAccess">Purpose of Access</label>
                <textarea id="PurposeofAccess" name="PurposeofAccess" placeholder="请输入访问目的" required></textarea>
            </div>

            <div class="field full">
                <label for="Attachments">附件</label>
                <input type="file" id="Attachments" name="Attachments" multiple />
                <div class="hint">可上传一个或多个附件，提交时会一并发送附件名称与内容。</div>
            </div>
        </div>

        <div class="actions">
            <button type="submit" id="submitBtn">提交登记</button>
            <div id="msg"></div>
        </div>
    </form>
</div>

<script>
const url = "https://a143b6b17a06ee96bf0f7eecad2dac.13.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/b3cdcb54ce784ec59414ebd6530d2cdf/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=2TXyPnzHhuxRkmufQUIac35bcmJpHWmHhiEaf5-3wng";

function pad(value) {
    return String(value).padStart(2, "0");
}

function formatDate(date) {
    return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
    ].join("-");
}

function getWeekLabel(date) {
    const temp = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const day = temp.getUTCDay() || 7;
    temp.setUTCDate(temp.getUTCDate() + 4 - day);
    const yearStart = new Date(Date.UTC(temp.getUTCFullYear(), 0, 1));
    const week = Math.ceil((((temp - yearStart) / 86400000) + 1) / 7);
    return temp.getUTCFullYear() + "WK" + pad(week);
}

function getGuid() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
    }
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(char) {
        const rand = Math.random() * 16 | 0;
        const value = char === "x" ? rand : (rand & 0x3 | 0x8);
        return value.toString(16);
    });
}

function randomThreeDigits() {
    return String(Math.floor(Math.random() * 900) + 100);
}

function setMessage(text, type) {
    const msg = document.getElementById("msg");
    msg.className = type;
    msg.textContent = text;
}

function initializeDefaults() {
    const now = new Date();
    const yyyy = String(now.getFullYear());
    const mm = pad(now.getMonth() + 1);
    const dd = pad(now.getDate());
    const today = formatDate(now);

    document.getElementById("YearMonth").value = yyyy + mm;
    document.getElementById("YearWeek").value = getWeekLabel(now);
    document.getElementById("Title").value = "VAL" + yyyy + mm + dd + randomThreeDigits();
    document.getElementById("EventDate").value = today;
    document.getElementById("VisitPeriod").value = today + " 09:00~" + today + " 17:00";
    document.getElementById("GUID").value = getGuid();
}

function validateForm() {
    const factory = document.getElementById("Factory").value;
    const targetArea = document.getElementById("TargetArea").value.trim();
    const visitorName = document.getElementById("VisitorName").value.trim();
    const visitorType = document.getElementById("VisitorType").value;
    const visitorCompany = document.getElementById("VisitorCompany").value.trim();
    const vaildDocument = document.getElementById("VaildDocument").value.trim();
    const hostEmployeeMail = document.getElementById("HostEmployeeMail").value.replace(/\s+/g, "");
    const contactNumber = document.getElementById("ContactNumber").value.trim();
    const purposeofAccess = document.getElementById("PurposeofAccess").value.trim();

    if (!factory) {
        return "请选择工厂。";
    }
    if (!targetArea) {
        return "请填写目标区域。";
    }
    if (!visitorName) {
        return "请填写访客姓名。";
    }
    if (/\s/.test(visitorName)) {
        return "访客姓名不得包含空格。";
    }
    if (!visitorType) {
        return "请选择访客类型。";
    }
    if (!/^[A-Za-z0-9\u4e00-\u9fa5]{2,}$/.test(visitorCompany)) {
        return "访客公司至少 2 个字符，且不得包含符号或空格。";
    }
    if (!/^[A-Za-z0-9]{8,}$/.test(vaildDocument)) {
        return "访客证件至少 8 个字符，且不得包含符号或空格。";
    }
    if (!/^[A-Za-z0-9]+(\.[A-Za-z0-9]+)?$/.test(hostEmployeeMail) || (hostEmployeeMail.match(/\./g) || []).length > 1) {
        return "陪同人邮箱请仅填写 @ 前内容，且只能包含一个 . 。";
    }
    if (!/^\d{11}$/.test(contactNumber)) {
        return "联系电话必须为 11 位纯数字。";
    }
    if (/^(\d)\1{10}$/.test(contactNumber)) {
        return "联系电话不能为 11 位相同数字。";
    }
    if (!purposeofAccess) {
        return "请填写访问目的。";
    }

    return "";
}

function fileToBase64(file, titleValue, guidValue) {
    return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onload = function() {
            const result = String(reader.result);
            const content = result.includes(",") ? result.split(",")[1] : result;
            resolve({
                name: titleValue + "_" + guidValue + "_" + file.name,
                type: file.type || "application/octet-stream",
                size: file.size,
                contentBase64: content
            });
        };
        reader.onerror = function() {
            reject(new Error("附件读取失败"));
        };
        reader.readAsDataURL(file);
    });
}

async function buildPayload() {
    const attachmentFiles = Array.from(document.getElementById("Attachments").files || []);
    const titleValue = document.getElementById("Title").value;
    const guidValue = document.getElementById("GUID").value;
    const attachments = await Promise.all(attachmentFiles.map(function(file) {
        return fileToBase64(file, titleValue, guidValue);
    }));
    const hostMailPrefix = document.getElementById("HostEmployeeMail").value.replace(/\s+/g, "");

    return {
        YearMonth: document.getElementById("YearMonth").value,
        YearWeek: document.getElementById("YearWeek").value,
        Title: titleValue,
        EventDate: document.getElementById("EventDate").value,
        Factory: document.getElementById("Factory").value,
        TargetArea: document.getElementById("TargetArea").value.trim(),
        VisitorName: document.getElementById("VisitorName").value.trim(),
        VisitorType: document.getElementById("VisitorType").value,
        VisitorCompany: document.getElementById("VisitorCompany").value.trim(),
        VaildDocument: document.getElementById("VaildDocument").value.trim(),
        QTY: document.getElementById("QTY").value,
        HostEmployee: document.getElementById("HostEmployee").value,
        HostEmployeeMail: hostMailPrefix.toLowerCase() + "@thermofisher.com",
        ContactNumber: document.getElementById("ContactNumber").value.trim(),
        Action: document.getElementById("Action").value,
        PurposeofAccess: document.getElementById("PurposeofAccess").value.trim(),
        DedicatedEmail: document.getElementById("DedicatedEmail").value,
        ReceptionistEmail: document.getElementById("ReceptionistEmail").value,
        VAID: document.getElementById("VAID").value,
        ReferenceID: document.getElementById("ReferenceID").value,
        VisitPeriod: document.getElementById("VisitPeriod").value,
        Urgent: document.getElementById("Urgent").value,
        Risk: document.getElementById("Risk").value,
        Attachments: attachments,
        PeriodType: document.getElementById("PeriodType").value,
        GUID: guidValue
    };
}

document.getElementById("visitorForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    initializeDefaults();

    const error = validateForm();
    if (error) {
        setMessage(error, "error");
        return;
    }

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    setMessage("提交中，请稍候...", "info");

    try {
        const payload = await buildPayload();
        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        setMessage("提交成功，访客临时入场登记已发送。", "success");
        document.getElementById("visitorForm").reset();
        initializeDefaults();
    } catch (error) {
        setMessage("提交失败，请检查网络或接口配置后重试。", "error");
    } finally {
        submitBtn.disabled = false;
    }
});

initializeDefaults();
</script>
</body>
</html>
