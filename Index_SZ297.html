<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background:
        radial-gradient(circle at top, rgba(19, 114, 182, 0.16), transparent 32%),
        linear-gradient(180deg, #eef5fb 0%, #f7f9fc 100%);
    color: #1f2937;
    padding: 24px 16px;
}
.panel {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid #dbe5f0;
    border-radius: 3px;
    box-shadow: 0 18px 40px rgba(28, 63, 99, 0.10);
    overflow: hidden;
}
.hero {
    position: relative;
    padding: 28px 28px 18px;
    background: linear-gradient(135deg, #0f6cbd 0%, #0c8f77 100%);
    color: #fff;
    text-align: center;
}
.hero-top {
    position: relative;
    min-height: 34px;
    margin-bottom: 4px;
}
.hero-logo {
    position: absolute;
    left: 0;
    top: 0;
    height: 22.5px;
    width: auto;
    display: block;
}
.hero h1 {
    margin: 11px 0 8px;
    font-size: 28px;
    line-height: 1.2;
    text-align: center;
}
.hero p {
    margin: 0;
    font-size: 14px;
    opacity: 0.92;
    text-align: center;
}
form {
    padding: 24px 28px 28px;
}
.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px 16px;
}
.field {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.field-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}
.field.full {
    grid-column: 1 / -1;
}
label {
    font-size: 14px;
    font-weight: 600;
    color: #334155;
}
.required::after {
    content: " *";
    color: #d92d20;
}
input,
select,
textarea {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 3px;
    background: #fff;
    padding: 12px 14px;
    font-size: 15px;
    color: #0f172a;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: #0f6cbd;
    box-shadow: 0 0 0 4px rgba(15, 108, 189, 0.12);
}
textarea {
    min-height: 112px;
    resize: vertical;
}
.hint {
    font-size: 12px;
    color: #64748b;
    margin-top: -2px;
}
.toggle-wrap {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #475569;
}
.toggle-switch {
    position: relative;
    display: inline-flex;
    width: 42px;
    height: 20px;
}
.toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
}
.toggle-slider {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: #cbd5e1;
    transition: background 0.2s ease;
    cursor: pointer;
}
.toggle-slider::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s ease;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
}
.toggle-switch input:checked + .toggle-slider {
    background: #0f6cbd;
}
.toggle-switch input:checked + .toggle-slider::before {
    transform: translateX(22px);
}
.multi-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.multi-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 160px;
    gap: 12px;
    align-items: center;
}
.multi-actions {
    display: flex;
    gap: 8px;
}
.row-btn {
    width: 100%;
    padding: 12px 10px;
    font-size: 14px;
    box-shadow: none;
}
.row-btn.remove {
    background: linear-gradient(135deg, #64748b 0%, #475569 100%);
}
.single-mode {
    display: block;
}
.multi-mode {
    display: none;
}
.is-multi .single-mode {
    display: none;
}
.is-multi .multi-mode {
    display: block;
}
.actions {
    margin-top: 24px;
}
button {
    width: 100%;
    border: none;
    border-radius: 3px;
    padding: 14px 18px;
    background: linear-gradient(135deg, #0f6cbd 0%, #0b8f75 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    box-shadow: 0 12px 24px rgba(15, 108, 189, 0.18);
}
button:hover { transform: translateY(-1px); }
button:disabled {
    cursor: not-allowed;
    opacity: 0.7;
    transform: none;
}
#msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 3px;
    font-size: 14px;
    display: none;
}
#msg.info {
    display: block;
    background: #eff6ff;
    color: #1d4ed8;
}
#msg.success {
    display: block;
    background: #ecfdf3;
    color: #027a48;
}
#msg.error {
    display: block;
    background: #fef3f2;
    color: #b42318;
}
@media (max-width: 640px) {
    .hero,
    form {
        padding-left: 18px;
        padding-right: 18px;
    }
    .grid {
        grid-template-columns: 1fr;
    }
    .multi-row {
        grid-template-columns: 1fr;
    }
    .multi-actions {
        width: 100%;
    }
}
</style>
</head>

function pad(value) {
    return String(value).padStart(2, "0");
}

function formatDate(date) {
    return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
    ].join("-");
}

function formatDateTimeCompact(date) {
    return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate()),
        pad(date.getHours()),
        pad(date.getMinutes()),
        pad(date.getSeconds())
    ].join("");
}

function getWeekLabel(date) {
    const temp = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const day = temp.getUTCDay() || 7;
    temp.setUTCDate(temp.getUTCDate() + 4 - day);
    const yearStart = new Date(Date.UTC(temp.getUTCFullYear(), 0, 1));
    const week = Math.ceil((((temp - yearStart) / 86400000) + 1) / 7);
    return temp.getUTCFullYear()  + pad(week);
}

function getGuid() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
    }
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(char) {
        const rand = Math.random() * 16 | 0;
        const value = char === "x" ? rand : (rand & 0x3 | 0x8);
        return value.toString(16);
    });
}

function randomThreeDigits() {
    return String(Math.floor(Math.random() * 900) + 100);
}

function setMessage(text, type) {
    const msg = document.getElementById("msg");
    msg.className = type;
    msg.textContent = text;
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&#39;"
        }[char];
    });
}

function isMultiVisitorMode() {
    return document.getElementById("MultiVisitorToggle").checked;
}

function getVisitorNameInputs() {
    return Array.from(document.querySelectorAll(".visitor-name-input"));
}

function getVisitorDocumentInputs() {
    return Array.from(document.querySelectorAll(".visitor-document-input"));
}

function updateMultiToggleUi() {
    const enabled = isMultiVisitorMode();
    document.getElementById("visitorNameField").classList.toggle("is-multi", enabled);
    document.getElementById("visitorDocumentField").classList.toggle("is-multi", enabled);
    document.getElementById("multiVisitorToggleText").textContent = enabled ? "TRUE" : "FALSE";
}

function renderVisitorRows(nameValues, documentValues) {
    const nameRows = document.getElementById("visitorNameRows");
    const documentRows = document.getElementById("visitorDocumentRows");
    const rowCount = Math.max(nameValues.length, documentValues.length, 1);
    let nameHtml = "";
    let documentHtml = "";

    for (let index = 0; index < rowCount; index += 1) {
        const nameValue = escapeHtml(nameValues[index] || "");
        const documentValue = escapeHtml(documentValues[index] || "");
        const disableRemove = rowCount === 1 ? " disabled" : "";

        nameHtml +=
            '<div class="multi-row">' +
                '<input type="text" class="visitor-name-input" placeholder="请输入访客姓名" value="' + nameValue + '" />' +
                '<div class="multi-actions">' +
                    '<button type="button" class="row-btn add" data-index="' + index + '">增加</button>' +
                    '<button type="button" class="row-btn remove" data-index="' + index + '"' + disableRemove + '>移除</button>' +
                "</div>" +
            "</div>";

        documentHtml +=
            '<div class="multi-row">' +
                '<input type="text" class="visitor-document-input" placeholder="请输入访客证件" value="' + documentValue + '" />' +
                '<div class="multi-actions">' +
                    '<button type="button" class="row-btn add" data-index="' + index + '">增加</button>' +
                    '<button type="button" class="row-btn remove" data-index="' + index + '"' + disableRemove + '>移除</button>' +
                "</div>" +
            "</div>";
    }

    nameRows.innerHTML = nameHtml;
    documentRows.innerHTML = documentHtml;
}

function syncMultiRows(action, rowIndex) {
    const nameValues = getVisitorNameInputs().map(function(input) {
        return input.value;
    });
    const documentValues = getVisitorDocumentInputs().map(function(input) {
        return input.value;
    });

    if (action === "add") {
        nameValues.splice(rowIndex + 1, 0, "");
        documentValues.splice(rowIndex + 1, 0, "");
    } else if (action === "remove" && nameValues.length > 1) {
        nameValues.splice(rowIndex, 1);
        documentValues.splice(rowIndex, 1);
    }

    renderVisitorRows(nameValues, documentValues);
}

function getVisitorGroupValues() {
    if (!isMultiVisitorMode()) {
        return {
            names: [document.getElementById("VisitorName").value.trim()],
            documents: [document.getElementById("VaildDocument").value.trim()]
        };
    }

    return {
        names: getVisitorNameInputs().map(function(input) {
            return input.value.trim();
        }),
        documents: getVisitorDocumentInputs().map(function(input) {
            return input.value.trim();
        })
    };
}

function resetVisitorSections() {
    document.getElementById("MultiVisitorToggle").checked = false;
    renderVisitorRows([""], [""]);
    updateMultiToggleUi();
}

function updateFactoryEmails() {
    const factory = document.getElementById("Factory").value;
    const mapping = factoryEmailMap[factory];
    document.getElementById("DedicatedEmail").value = mapping ? mapping.DedicatedEmail : "";
    document.getElementById("ReceptionistEmail").value = mapping ? mapping.ReceptionistEmail : "";
}

function initializeDefaults() {
    const now = new Date();
    const yyyy = String(now.getFullYear());
    const mm = pad(now.getMonth() + 1);
    const dd = pad(now.getDate());
    const today = formatDate(now);

    document.getElementById("YearMonth").value = yyyy + mm;
    document.getElementById("YearWeek").value = getWeekLabel(now);
    document.getElementById("Title").value = "VAL" + yyyy + mm + dd + randomThreeDigits();
    document.getElementById("EventDate").value = today;
    document.getElementById("VisitPeriod").value = today + " 09:00~" + today + " 17:00";
    document.getElementById("GUID").value = getGuid();
    updateFactoryEmails();
}

function validateForm() {
    const factory = document.getElementById("Factory").value;
    const targetArea = document.getElementById("TargetArea").value.trim();
    const visitorGroupValues = getVisitorGroupValues();
    const visitorNames = visitorGroupValues.names;
    const visitorDocuments = visitorGroupValues.documents;
    const visitorType = document.getElementById("VisitorType").value;
    const visitorCompany = document.getElementById("VisitorCompany").value.trim();
    const hostEmployeeMail = document.getElementById("HostEmployeeMail").value.replace(/\s+/g, "");
    const contactNumber = document.getElementById("ContactNumber").value.trim();
    const purposeofAccess = document.getElementById("PurposeofAccess").value.trim();
    const attachmentFiles = Array.from(document.getElementById("Attachments").files || []);

    if (!factory) {
        return "请选择工厂。";
    }
    if (!targetArea) {
        return "请填写目标区域。";
    }
    if (visitorNames.some(function(value) { return !value; })) {
        return "请填写所有访客姓名。";
    }
    if (visitorNames.some(function(value) { return /\s/.test(value); })) {
        return "访客姓名不得包含空格。";
    }
    if (!visitorType) {
        return "请选择访客类型。";
    }
    if (!/^[A-Za-z0-9\u4e00-\u9fa5]{2,}$/.test(visitorCompany)) {
        return "访客公司至少 2 个字符，且不得包含符号或空格。";
    }
    if (visitorDocuments.some(function(value) { return !value; })) {
        return "请填写所有访客证件。";
    }
    if (visitorDocuments.some(function(value) { return !/^[A-Za-z0-9]{8,}$/.test(value); })) {
        return "访客证件至少 8 个字符，且不得包含符号或空格。";
    }
    if (!/^[A-Za-z0-9]+(\.[A-Za-z0-9]+)?$/.test(hostEmployeeMail) || (hostEmployeeMail.match(/\./g) || []).length > 1) {
        return "陪同人邮箱请仅填写 @ 前内容，且只能包含一个 . 。";
    }
    if (!/^\d{11}$/.test(contactNumber)) {
        return "联系电话必须为 11 位纯数字。";
    }
    if (/^(\d)\1{10}$/.test(contactNumber)) {
        return "联系电话不能为 11 位相同数字。";
    }
    if (!purposeofAccess) {
        return "请填写访问目的。";
    }
    if (attachmentFiles.length !== 1) {
        return "请上传 1 个附件。";
    }

    return "";
}

function fileToBase64(file, titleValue, guidValue) {
    return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onload = function() {
            const result = String(reader.result);
            const content = result.includes(",") ? result.split(",")[1] : result;
            const fileTimestamp = formatDateTimeCompact(new Date());
            resolve({
                name: fileTimestamp + "_" + titleValue + "_TempSign_" + guidValue + file.name,
                type: file.type || "application/octet-stream",
                size: file.size,
                contentBase64: content
            });
        };
        reader.onerror = function() {
            reject(new Error("附件读取失败"));
        };
        reader.readAsDataURL(file);
    });
}

async function buildPayload() {
    const attachmentFiles = Array.from(document.getElementById("Attachments").files || []);
    const titleValue = document.getElementById("Title").value;
    const guidValue = document.getElementById("GUID").value;
    const visitorGroupValues = getVisitorGroupValues();
    const attachments = await Promise.all(attachmentFiles.map(function(file) {
        return fileToBase64(file, titleValue, guidValue);
    }));
    const hostMailPrefix = document.getElementById("HostEmployeeMail").value.replace(/\s+/g, "");

    return {
        YearMonth: document.getElementById("YearMonth").value,
        YearWeek: document.getElementById("YearWeek").value,
        Title: titleValue,
        EventDate: document.getElementById("EventDate").value,
        Factory: document.getElementById("Factory").value,
        TargetArea: document.getElementById("TargetArea").value.trim(),
        VisitorName: visitorGroupValues.names.join(";"),
        VisitorType: document.getElementById("VisitorType").value,
        VisitorCompany: document.getElementById("VisitorCompany").value.trim(),
        VaildDocument: visitorGroupValues.documents.join(";"),
        QTY: document.getElementById("QTY").value,
        HostEmployee: document.getElementById("HostEmployee").value,
        HostEmployeeMail: hostMailPrefix.toLowerCase() + "@thermofisher.com",
        ContactNumber: document.getElementById("ContactNumber").value.trim(),
        Action: document.getElementById("Action").value,
        PurposeofAccess: document.getElementById("PurposeofAccess").value.trim(),
        DedicatedEmail: document.getElementById("DedicatedEmail").value,
        ReceptionistEmail: document.getElementById("ReceptionistEmail").value,
        VAID: document.getElementById("VAID").value,
        ReferenceID: document.getElementById("ReferenceID").value,
        VisitPeriod: document.getElementById("VisitPeriod").value,
        Urgent: document.getElementById("Urgent").value,
        Risk: document.getElementById("Risk").value,
        Attachments: attachments,
        PeriodType: document.getElementById("PeriodType").value,
        GUID: guidValue
    };
}

document.addEventListener("click", function(event) {
    if (!event.target.classList.contains("row-btn")) {
        return;
    }

    const rowIndex = Number(event.target.getAttribute("data-index"));
    if (Number.isNaN(rowIndex)) {
        return;
    }

    if (event.target.classList.contains("add")) {
        syncMultiRows("add", rowIndex);
    } else if (event.target.classList.contains("remove")) {
        syncMultiRows("remove", rowIndex);
    }
});

document.getElementById("MultiVisitorToggle").addEventListener("change", function() {
    if (this.checked) {
        const currentName = document.getElementById("VisitorName").value.trim();
        const currentDocument = document.getElementById("VaildDocument").value.trim();
        renderVisitorRows([currentName], [currentDocument]);
    }
    updateMultiToggleUi();
});

document.getElementById("Factory").addEventListener("change", function() {
    updateFactoryEmails();
});

document.getElementById("visitorForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    initializeDefaults();

    const error = validateForm();
    if (error) {
        setMessage(error, "error");
        return;
    }

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    setMessage("提交中，请稍候...", "info");

    try {
        const payload = await buildPayload();
        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const selectedFactory = payload.Factory;
        setMessage("提交成功，访客临时入场登记已发送。", "success");
        alert("欢迎进入ThermoFisher " + selectedFactory);
        document.getElementById("visitorForm").reset();
        resetVisitorSections();
        initializeDefaults();
    } catch (error) {
        setMessage("提交失败，请检查网络或接口配置后重试。", "error");
    } finally {
        submitBtn.disabled = false;
    }
});

resetVisitorSections();
initializeDefaults();
</script>
